services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}  # p. ej. mirror.gcr.io/library/postgres:16 si Docker Hub limita
    environment:
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio
      POSTGRES_DB: observatorio
    # El /dev/shm de 64 MB que Docker da por defecto no alcanza para VACUUM ni consultas paralelas.
    shm_size: 1g
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatorio"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
