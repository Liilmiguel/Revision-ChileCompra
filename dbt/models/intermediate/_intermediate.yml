version: 2

models:
  - name: int_linea_adjudicada
    description: Líneas adjudicadas con la marca de monto atípico (error de captura) y su motivo.
    tests:
      - unique_combination:
          arguments: {columns: [source_month, row_num]}
    columns:
      - name: motivo_atipico
        tests:
          - accepted_values:
              arguments: {values: ['cantidad', 'tope', 'estimado']}

  - name: int_licitacion_competencia
    description: Competencia efectiva por licitación (oferentes aceptados/rechazados, sobreprecio frente a la oferta aceptada más barata).
    columns:
      - name: codigo_externo
        tests: [unique, not_null]

  - name: int_precio_referencia
    description: Mediana de precio unitario adjudicado por producto ONU × unidad, solo bienes homogéneos.
    tests:
      - unique_combination:
          arguments: {columns: [onu, um]}

  - name: int_licitacion_senales
    description: Seis señales de riesgo por licitación adjudicada y su puntaje ponderado (0–100).
    columns:
      - name: codigo_externo
        tests: [unique, not_null]
      - name: puntaje_riesgo
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}

  - name: int_licitacion_rubro
    description: Rubros de nivel 1 y 2 de cada licitación con su número de líneas; es_principal marca el de más líneas.
    tests:
      - unique_combination:
          arguments: {columns: [codigo_externo, rubro1, rubro2]}

  - name: int_licitacion_senales_extra
    description: Señales complementarias (no suman al puntaje) — ofertas idénticas no redondas y fraccionamiento de compras menores.
    columns:
      - name: codigo_externo
        tests: [unique, not_null]
