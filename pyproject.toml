[project]
name = "observatorio-compras-publicas"
version = "0.1.0"
description = "Pipeline y análisis de licitaciones de Mercado Público (ChileCompra)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
