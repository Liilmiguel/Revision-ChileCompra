[project]
name = "observatorio-compras-publicas"
version = "0.1.0"
description = "Pipeline y análisis de licitaciones de Mercado Público (ChileCompra)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
observatorio = "observatorio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio"]

[dependency-groups]
dashboard = [
    "duckdb>=1.3",
    "pandas>=2.2",
    "plotly>=6",
    "pyarrow>=18",
    "streamlit>=1.50",
]
dbt = [
    "dbt-postgres>=1.9",
]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["observatorio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
