name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: observatorio
          POSTGRES_DB: observatorio
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U observatorio" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://observatorio:observatorio@localhost:5432/observatorio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
